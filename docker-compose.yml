services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      POSTGRES_DSN: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@baza-postgres:5432/messenger?sslmode=disable
      REDIS_ADDR: baza-redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    networks:
      - infra
    restart: unless-stopped

networks:
  infra:
    external: true
    name: ve13_app-network
